  <!-- 1. Albo d'oro: tutte le edizioni insieme -->

    <h2>Albo d'oro</h2>
    <div id="albo"></div>

  <section id="sezione-filtro">

    <div class="anno-bar">
      <span class="anno-label">Stagione</span>

  <!-- 3. Risultati e crediti della stagione scelta -->
  <section id="sezione-stagione">

  <p>Dati aggiornati al <span id="generato-il">—</span>, da <code>dati/Gestione.xlsx</code>.</p>
